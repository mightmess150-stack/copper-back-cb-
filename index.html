<!DOCTYPE html>
<html lang="ar" dir="rtl" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> copper back (cb) </title>
  <link rel="icon" type="image/png" href="logo.png">
  <style>
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
   
      background: linear-gradient(135deg, 
        #3b154c 0%, 
        #7b2cbf 35%, 
        #c9184a 70%, 
        #590d22 100%
      );
      background-attachment: fixed;
      color: #ffffff;
      overflow-x: hidden;
    }

    .card {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 24px;
      padding: 40px;
      width: 90%;
      max-width: 500px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
    }

    .card h1 {
      font-size: 2.2rem;
      margin-bottom: 15px;
      background: linear-gradient(45deg, #ff758f, #ffb5a7);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .card p {
      font-size: 1.1rem;
      line-height: 1.6;
      color: #e0e0e0;
      margin-bottom: 25px;
    }

    .card button {
      background: linear-gradient(90deg, #c9184a, #7b2cbf);
      color: #fff;
      border: none;
      padding: 12px 32px;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 50px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 8px 20px rgba(201, 24, 74, 0.4);
    }

    .card button:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 25px rgba(123, 44, 191, 0.6);
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>العنوان الرئيسي</h1>
    <p>هذا التدرج يدمج بين البنفسجي الملكي والأحمر الياقوتي بأسلوب عصري ومريح للعين، ويعطي انطباعاً بالفخامة والأمان.</p>
    <button>ابدأ الآن</button>
  </div>
</body>
</html>
